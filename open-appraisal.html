<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>문화유산 감정 — 이동</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23000000'/><text x='32' y='46' font-size='38' fill='%23ece9e2' text-anchor='middle' font-family='serif' font-weight='500'>審</text></svg>">
<style>
/* 문화유산 감정 — 중계 화면 (인트로 v4.0과 같은 「다섯 벌」 백 벌)
   바탕 흰색, 글자와 선은 먹, 모든 면은 직각. 색은 審 인장(흑) 하나뿐이다. 단추는 먹색 채움 / 먹 테두리. */
@font-face { font-family: 'Dasot Serif'; font-weight: 500; font-style: normal; font-display: swap; src: url('fonts/dasot-serif-500.woff2') format('woff2'); }
:root {
  --bg: #ffffff; --ink: #000000; --ink-2: #3a3a3a; --mute: #6e6e6e; --seam: #cfcfcf;
  --serif: 'Dasot Serif', 'Noto Serif KR', 'Noto Serif CJK KR', 'AppleMyungjo', 'Batang', serif;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', 'Noto Sans KR', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink-2); font-family: var(--sans); font-size: 15px; line-height: 1.7; word-break: keep-all;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
}
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.box { max-width: 420px; width: 100%; }
.seal { display: block; width: 72px; height: 72px; margin-bottom: 18px; }
.seal text { font-family: var(--serif); font-weight: 500; font-size: 38px; text-anchor: middle; fill: #ece9e2; }
h1 { font-family: var(--serif); font-weight: 500; font-size: 22px; line-height: 1.35; color: var(--ink); margin-bottom: 6px; }
#msg { min-height: 1.7em; }
.ver { color: var(--mute); font-size: 12.5px; margin: 2px 0 18px; min-height: 1.7em; }
.btn {
  display: block; min-height: 48px; padding: 12px 16px; margin-bottom: 10px; text-align: center; text-decoration: none;
  border: 1.5px solid var(--ink); background: var(--ink); color: var(--bg); font-size: 16px; font-weight: 500; line-height: 1.4;
}
.btn:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn.sub { background: var(--bg); color: var(--ink); font-size: 15px; }
.btn.sub:hover { background: var(--bg); border-color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.tip { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--seam); font-size: 13.5px; line-height: 1.75; }
.tip b { font-weight: 500; color: var(--ink); }
.fine { color: var(--mute); font-size: 12.5px; margin-top: 12px; }
</style>
</head>
<body>
<div class="box">
  <svg class="seal" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect width="64" height="64" fill="#000000"/><text x="32" y="46">審</text></svg>
  <h1>문화유산 감정</h1>
  <p id="msg">문화유산 감정 도구로 이동합니다.</p>
  <p class="ver" id="ver"></p>
  <a class="btn" id="open" href="#">감정 도구 열기</a>
  <a class="btn sub" href="./">실무 도구 목록으로 돌아가기</a>
  <p class="tip">아이폰·아이패드에서는 클로드 앱의 작은 창으로 열립니다. 넓은 화면으로 쓰시려면 <b>「감정 도구 열기」를 길게 눌러 "새로운 탭에서 열기"</b>를 선택하십시오. 그렇게 연 뒤 사파리 공유 메뉴에서 <b>「홈 화면에 추가」</b>를 해 두면, 다음부터는 그 아이콘으로 바로 열립니다.</p>
  <p class="fine">앱을 닫고 이 화면으로 돌아오면 위 버튼으로 다시 들어갈 수 있습니다. 사진 등록이 되지 않을 때는 이 주소를 사파리나 크롬에서 열어 주십시오.</p>
</div>

<script>
/* ── 릴리스 관리 지점: 재게시 시 아래 두 줄만 수정한다. 인트로(index.html)는 이 라벨을 자동으로 읽는다 ── */
var APP_URL = "https://claude.ai/public/artifacts/df5e8bd4-3376-4966-b111-9fb6ec8d49d7";
var APP_VERSION_LABEL = " 감정지침 v2.8 앱판 r9 (2026-09-05)";

(function () {
  var link = document.getElementById('open');
  var verEl = document.getElementById('ver');
  if (verEl) verEl.textContent = APP_VERSION_LABEL;
  var msg = document.getElementById('msg');
  link.href = APP_URL;

  function manual(text) {
    msg.textContent = text;
  }

  /* 이 탭에서 이미 한 번 넘긴 경우에는 자동 이동하지 않는다.
     앱에서 돌아왔을 때 다시 앱으로 끌려가는 순환을 막는다. */
  var KEY = 'hj-relay-handoff';
  var already = false;
  try { already = sessionStorage.getItem(KEY) === '1'; } catch (e) { already = false; }

  if (already) {
    manual('감정 도구를 다시 열려면 아래 버튼을 눌러 주십시오.');
    return;
  }

  /* 화면이 그려진 뒤에 이동한다. 즉시 이동하면 빈 화면만 남는다.
     location.href를 쓰므로 이 페이지가 방문 기록에 남아 되돌아올 수 있다. */
  setTimeout(function () {
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
    location.href = APP_URL;
    setTimeout(function () {
      manual('자동으로 열리지 않으면 아래 버튼을 눌러 주십시오.');
    }, 1500);
  }, 700);

  /* 뒤로가기나 앱 종료로 이 페이지가 되살아난 경우 안내만 표시한다 */
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) manual('감정 도구를 다시 열려면 아래 버튼을 눌러 주십시오.');
  });
})();
</script>
</body>
</html>
